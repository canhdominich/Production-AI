apiVersion: v1
kind: Pod
metadata:
  name: vllm-qwen3-8b
  labels:
    app: provider
spec:
  nodeSelector:
    accelerator: gpu-24gb
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: vllm
      image: vllm/vllm-openai:PINNED_TAG
      args: ["--model", "Qwen/Qwen3-8B", "--max-model-len", "8192", "--gpu-memory-utilization", "0.9"]
      ports:
        - containerPort: 8000
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: 32Gi
